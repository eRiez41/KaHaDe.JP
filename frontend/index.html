<!doctype html>
<html lang="id" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KaHaDe.JP — Kata Hapalan Dengar Japan. Aplikasi TTS kosakata Jepang-Indonesia." />
    <meta name="application-name" content="KaHaDe.JP" />
    <meta name="theme-color" content="#FFF8F5" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>KaHaDe.JP — Kata Hapalan Dengar Japan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Boot splash + skip link. Both are styled here so the first paint never
         flashes unstyled text before Tailwind loads. */
      .skip-link {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      .skip-link:focus {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 300;
        width: auto;
        height: auto;
        margin: 0;
        padding: 0.5rem 1rem;
        overflow: visible;
        clip-path: none;
        white-space: normal;
        border-radius: 999px;
        background: #8f4c00;
        color: #fff;
        font-family: 'Roboto Flex', system-ui, sans-serif;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff8f5;
        color: #8f4c00;
        font-family: 'Roboto Flex', system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition:
          opacity 260ms ease,
          visibility 260ms ease;
      }

      html.dark #boot-splash {
        background: #1a1209;
        color: #ffb77c;
      }

      #boot-splash.boot-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
        animation: boot-rise 420ms ease both;
      }

      .boot-jp {
        font-family: 'Noto Sans JP', system-ui, sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.45em;
        text-indent: 0.45em;
        opacity: 0.5;
      }

      .boot-logo {
        font-size: 1.9rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .boot-logo span {
        opacity: 0.55;
      }

      .boot-bar {
        width: 8.5rem;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: currentColor;
        opacity: 0.18;
      }

      .boot-bar span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: currentColor;
        animation: boot-slide 900ms ease-in-out infinite;
      }

      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(340%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-mark,
        .boot-bar span {
          animation: none;
        }

        .boot-bar span {
          width: 100%;
        }
      }
    </style>
    <script>
      window.__bootAt = performance.now()
      try {
        const saved = JSON.parse(localStorage.getItem('tts-jpn-settings') || '{}')
        const theme = saved.theme || 'system'
        const dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        const meta = document.querySelector('meta[name="theme-color"]')
        if (meta) {
          meta.content = dark ? '#1A1209' : '#FFF8F5'
        }
      } catch {
        // ignore storage failures
      }
    </script>
  </head>
  <body class="h-full">
    <a href="#main-content" class="skip-link">Lewati ke konten</a>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-mark">
        <span class="boot-jp">日本語</span>
        <span class="boot-logo">KaHaDe<span>.JP</span></span>
        <span class="boot-bar"><span></span></span>
      </div>
    </div>
    <noscript>
      <style>
        #boot-splash {
          display: none;
        }
      </style>
    </noscript>
    <div id="app" class="min-h-full"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
